services:
  platform-db:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: conductor
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U conductor -d conductor"]
      interval: 5s
      timeout: 5s
      retries: 20

  conductor:
    build:
      context: ./conductor
      args:
        PLATFORM_VERSION: ${PLATFORM_VERSION:-nightly}
    depends_on:
      platform-db:
        condition: service_healthy
    environment:
      QUARKUS_PROFILE: dev
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_DATASOURCE_USERNAME: conductor
      QUARKUS_DATASOURCE_PASSWORD: conductor
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://platform-db:5432/conductor
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: "${PLATFORM_UI_ORIGIN:-http://localhost:3000}"
      PIPELINE_DEPLOYMENT_MODE: host
      PIPELINE_HOST_CONTAINER_RUNTIME: ansible
      PLATFORM_HOST_SSH_CONFIG_PATH: /root/.ssh/config
      PLATFORM_HOST_RECONCILIATION_INTERVAL: 5s
      PLATFORM_HOST_DEBEZIUM_SERVER_IMAGE: quay.io/debezium/server:${PLATFORM_VERSION:-nightly}
    volumes:
      - ${HOST_EXAMPLE_SSH_DIR:?Set HOST_EXAMPLE_SSH_DIR to the example SSH directory}:/root/.ssh:ro
    ports:
      - "8081:8081"

  stage:
    image: quay.io/debezium/platform-stage:${PLATFORM_VERSION:-nightly}
    depends_on:
      - conductor
    environment:
      CONDUCTOR_URL: "${CONDUCTOR_URL:-http://localhost:8081}"
    ports:
      - "3000:3000"

  source-postgres:
    image: quay.io/debezium/example-postgres:${DEBEZIUM_VERSION:-3.7}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  receiver:
    build: ./receiver
    volumes:
      - receiver-events:/events
    ports:
      - "9900:9900"

volumes:
  receiver-events:
