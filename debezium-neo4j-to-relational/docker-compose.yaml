services:
  kafka:
    image: quay.io/debezium/kafka:${DEBEZIUM_VERSION}
    ports:
      - 9092:9092
      - 9093:9093
    environment:
      - CLUSTER_ID=oh-sxaDRTcyAr6pFRbXyzA
      - NODE_ID=1
      - NODE_ROLE=combined
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092

  postgres:
    image: postgres:${POSTGRES_VERSION}
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres

  # CDC is a Neo4j Enterprise feature, so this uses the enterprise image (license accepted for
  # evaluation/development use, as the Neo4j image requires).
  neo4j:
    image: neo4j:5-enterprise
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_security_auth__minimum__password__length=1

  # enables CDC on the `neo4j` database and populates the graph
  neo4j-init:
    image: neo4j:5-enterprise
    depends_on:
      - neo4j
    environment:
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    entrypoint: ["bash", "/init-neo4j.sh"]
    volumes:
      - ./init-neo4j.sh:/init-neo4j.sh:ro
      - ./neo4j-seed.cypher:/seed.cypher:ro

  # Pinned to `nightly` because the Neo4jDebeziumConverter SMT is not in a released Debezium version yet
  # When the SMT ships in a release, replace `nightly` below with ${DEBEZIUM_VERSION} so it tracks the other images.
  connect:
    image: debezium-examples/debezium-neo4j-to-relational-connect:nightly
    build:
      context: debezium-connect
      args:
        DEBEZIUM_VERSION: nightly
        NEO4J_CONNECTOR_VERSION: ${NEO4J_CONNECTOR_VERSION:-5.5.2}
    ports:
      - "8083:8083"
      - "5005:5005"
    depends_on:
      - kafka
      - postgres
      - neo4j
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
