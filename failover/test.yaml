name: failover
description: Tests Debezium MySQL connector failover and GTID-based recovery across MySQL master-slave cluster with HAProxy
env_file: ../.env
compose_file: docker-compose.yaml

cleanup:
  type: docker_compose_down
  volumes: true

steps:
  - name: Ensure clean state before starting
    type: docker_compose_down
    volumes: true

  - name: Build custom images
    type: docker_compose_build

  - name: Start all services
    type: docker_compose_up
    detach: true

  - name: Wait for Kafka Connect REST API to be ready
    type: http_wait
    url: http://localhost:8083/connectors
    timeout_seconds: 120
    interval_seconds: 5

  - name: Register Debezium MySQL connector
    type: http_post
    url: http://localhost:8083/connectors
    body_file: register-mysql.json
    expected_status: [200, 201]

  - name: Wait for connector to be RUNNING
    type: http_wait
    url: http://localhost:8083/connectors/inventory-connector/status
    timeout_seconds: 60
    interval_seconds: 5
    expected_json_path: connector.state
    expected_value: RUNNING

  - name: Wait for connector task to be RUNNING
    type: http_wait
    url: http://localhost:8083/connectors/inventory-connector/status
    timeout_seconds: 60
    interval_seconds: 5
    expected_json_path: tasks.0.state
    expected_value: RUNNING

  - name: Insert records on primary MySQL server
    type: docker_compose_exec
    service: mysql1
    command: mysql -u root -pdebezium -e "USE inventory; INSERT INTO customers VALUES (default, 'John', 'Doe', 'john.doe@example.com');"

  - name: Verify change event from primary appears in Kafka
    type: kafka_consume
    topic: dbserver1.inventory.customers
    timeout_seconds: 60
    expected_content: "john.doe@example.com"

  - name: Stop primary MySQL server to simulate failure
    type: docker_compose_stop
    service: mysql1

  - name: Insert records on backup MySQL server
    type: docker_compose_exec
    service: mysql2
    command: mysql -u root -pdebezium -e "USE inventory; INSERT INTO customers VALUES (default, 'Peter', 'Doe', 'peter.doe@example.com');"

  - name: Restart connector task after failover
    type: http_post
    url: http://localhost:8083/connectors/inventory-connector/tasks/0/restart
    expected_status: [200, 204]

  - name: Wait for connector task to be RUNNING on backup
    type: http_wait
    url: http://localhost:8083/connectors/inventory-connector/status
    timeout_seconds: 60
    interval_seconds: 5
    expected_json_path: tasks.0.state
    expected_value: RUNNING

  - name: Verify post-failover change event appears in Kafka
    type: kafka_consume
    topic: dbserver1.inventory.customers
    timeout_seconds: 60
    expected_content: "peter.doe@example.com"
