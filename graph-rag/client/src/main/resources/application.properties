neo4j.uri=bolt://localhost:7687
neo4j.username=neo4j
neo4j.password=password
quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.chat-model.model-id=qwen2.5-coder:3b
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.ollama.embedding-model.model-id=nomic-embed-text
quarkus.langchain4j.ollama.timeout=300s
graph.rag.embedding.dimensions=768
graph.rag.retriever.max-results=5
# Drop matches below this cosine score (Neo4j normalizes to [0,1])
# nomic-embed-text has a high similarity floor (~0.72 even for unrelated text),
# while genuine matches reach ~0.89+, so 0.8 sits in that gap.
graph.rag.retriever.min-score=0.8
quarkus.banner.enabled=false
quarkus.log.category."io.quarkus".level=WARN
quarkus.log.category."io.debezium.examples.graphrag".level=INFO
