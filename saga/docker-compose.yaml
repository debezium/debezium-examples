services:
  jaeger:
    image: jaegertracing/all-in-one:1
    ports:
     - 6831:6831/udp
     - 16686:16686
    networks:
     - my-network

  kafka:
    image: quay.io/debezium/kafka:${DEBEZIUM_VERSION:-latest}
    ports:
      - 9092:9092
      - 9093:9093
    environment:
      - CLUSTER_ID=oh-sxaDRTcyAr6pFRbXyzA
      - NODE_ID=1
      - NODE_ROLE=combined
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    networks:
     - my-network

  connect:
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION:-latest}
    ports:
     - 8083:8083
    depends_on:
     - kafka
     - order-db
    environment:
     - BOOTSTRAP_SERVERS=kafka:9092
     - GROUP_ID=1
     - CONFIG_STORAGE_TOPIC=connect-configs
     - OFFSET_STORAGE_TOPIC=connect-offsets
     - STATUS_STORAGE_TOPIC=connect-status
     - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
     - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
     - ENABLE_DEBEZIUM_SCRIPTING=false
    networks:
     - my-network

  order-db:
    image: quay.io/debezium/example-postgres:${DEBEZIUM_VERSION:-latest}
    expose:
     - 5432
    healthcheck:
      test: "pg_isready -U orderuser -d orderdb"
      interval: 2s
      timeout: 20s
      retries: 10
    environment:
     - POSTGRES_USER=orderuser
     - POSTGRES_PASSWORD=orderpw
     - POSTGRES_DB=orderdb
    volumes:
     - ./init-order.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
     - my-network

  payment-db:
    image: quay.io/debezium/example-postgres:${DEBEZIUM_VERSION:-latest}
    expose:
     - 5432
    healthcheck:
      test: "pg_isready -U paymentuser -d paymentdb"
      interval: 2s
      timeout: 20s
      retries: 10
    environment:
     - POSTGRES_USER=paymentuser
     - POSTGRES_PASSWORD=paymentpw
     - POSTGRES_DB=paymentdb
    volumes:
     - ./init-payment.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
     - my-network

  customer-db:
    image: quay.io/debezium/example-postgres:${DEBEZIUM_VERSION:-latest}
    expose:
     - 5432
    healthcheck:
      test: "pg_isready -U customeruser -d customerdb"
      interval: 2s
      timeout: 20s
      retries: 10
    environment:
     - POSTGRES_USER=customeruser
     - POSTGRES_PASSWORD=customerpw
     - POSTGRES_DB=customerdb
    volumes:
     - ./init-customer.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
     - my-network

  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    volumes:
      - ./servers.json:/pgadmin4/servers.json
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - my-network

  order-service:
    image: debezium-examples/saga-order-service:${DEBEZIUM_VERSION:-latest}
    build:
      context: order-service
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
     - 8080:8080
    links:
     - kafka
     - order-db
     - jaeger
    environment:
     - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://order-db:5432/orderdb
     - MP_MESSAGING_INCOMING_PAYMENTRESPONSE_BOOTSTRAP_SERVERS=kafka:9092
     - MP_MESSAGING_INCOMING_CREDITRESPONSE_BOOTSTRAP_SERVERS=kafka:9092
     - JAEGER_SERVICE_NAME=order-service
     - JAEGER_SAMPLER_TYPE=const
     - JAEGER_SAMPLER_PARAM=1
     - JAEGER_AGENT_HOST=jaeger
    depends_on:
      order-db:
        condition: service_healthy
    networks:
      - my-network

  payment-service:
    image: debezium-examples/saga-payment-service:${DEBEZIUM_VERSION:-latest}
    build:
      context: payment-service
      dockerfile: src/main/docker/Dockerfile.jvm
    links:
     - kafka
     - payment-db
     - jaeger
    environment:
     - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://payment-db:5432/paymentdb
     - MP_MESSAGING_INCOMING_PAYMENT_BOOTSTRAP_SERVERS=kafka:9092
     - JAEGER_SERVICE_NAME=payment-service
     - JAEGER_SAMPLER_TYPE=const
     - JAEGER_SAMPLER_PARAM=1
     - JAEGER_AGENT_HOST=jaeger
    depends_on:
      payment-db:
        condition: service_healthy
    networks:
      - my-network

  customer-service:
    image: debezium-examples/saga-customer-service:${DEBEZIUM_VERSION:-latest}
    build:
      context: customer-service
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
     - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://customer-db:5432/customerdb
     - MP_MESSAGING_INCOMING_CREDIT_BOOTSTRAP_SERVERS=kafka:9092
     - JAEGER_SERVICE_NAME=customer-service
     - JAEGER_SAMPLER_TYPE=const
     - JAEGER_SAMPLER_PARAM=1
     - JAEGER_AGENT_HOST=jaeger
    depends_on:
      customer-db:
        condition: service_healthy
      kafka:
        condition: service_started
      jaeger:
        condition: service_started
    networks:
      - my-network

networks:
  my-network:
    name: saga-network
