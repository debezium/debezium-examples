# Kafka Connect distributed worker configuration
# Used by the custom kafka-connect image built via Dockerfile.connect

bootstrap.servers=kafka-broker:9092

# Unique cluster ID for this Connect worker group
group.id=debezium-connect

# JSON converters with schemas disabled (plain JSON output)
key.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

# Internal Kafka topics for Connect cluster state
config.storage.topic=_debezium-configs
config.storage.replication.factor=1
offset.storage.topic=_debezium-offsets
offset.storage.replication.factor=1
status.storage.topic=_debezium-status
status.storage.replication.factor=1

# REST API listener (exposed on port 8083 for all interfaces)
listeners=HTTP://:8083
rest.advertised.host.name=kafka-connect

# Path where Debezium connector JARs are installed (set in Dockerfile.connect)
plugin.path=/opt/kafka/plugins
