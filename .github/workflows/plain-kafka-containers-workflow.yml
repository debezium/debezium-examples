name: Build [plain-kafka-containers]

on:
  push:
    paths:
      - 'tutorial/plain-kafka-containers/**'
      - '.github/workflows/plain-kafka-containers-workflow.yml'
      - 'scripts/run-example-test.py'
  pull_request:
    paths:
      - 'tutorial/plain-kafka-containers/**'
      - '.github/workflows/plain-kafka-containers-workflow.yml'
      - 'scripts/run-example-test.py'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install pyyaml requests

      - name: Run plain-kafka-containers test
        run: python scripts/run-example-test.py tutorial/plain-kafka-containers
