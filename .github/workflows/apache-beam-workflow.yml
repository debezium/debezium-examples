name: Build [apache-beam]

on:
  push:
    paths:
      - 'apache-beam/**'
      - '.github/workflows/apache-beam-workflow.yml'
  pull_request:
    paths:
      - 'apache-beam/**'
      - '.github/workflows/apache-beam-workflow.yml'
      - '.env'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('apache-beam/**/pom.xml', 'pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Check changes in [apache-beam] example
        run: cd apache-beam && mvn clean install -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn -Dmaven.wagon.http.pool=false -Dmaven.wagon.httpconnectionManager.ttlSeconds=120
