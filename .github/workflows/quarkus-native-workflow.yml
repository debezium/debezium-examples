name: Build [quarkus-native]

on:
  push:
    paths:
      - 'quarkus-native/**'
      - '.github/workflows/quarkus-native-workflow.yml'
      - 'scripts/run-example-test.py'
  pull_request:
    paths:
      - 'quarkus-native/**'
      - '.github/workflows/quarkus-native-workflow.yml'
      - 'scripts/run-example-test.py'
      - '.env'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install pyyaml requests
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('quarkus-native/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Check changes in [quarkus-native] example (native build)
        run: cd quarkus-native && mvn clean package -Dnative
      - name: Run E2E Test
        run: python scripts/run-example-test.py quarkus-native
