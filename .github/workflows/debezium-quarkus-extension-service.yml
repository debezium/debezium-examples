name: Build [debezium-quarkus-extension-service]

on:
  push:
    paths:
      - 'debezium-quarkus-extension-service/**'
      - '.github/workflows/debezium-quarkus-extension-service.yml'
  pull_request:
    paths:
      - 'debezium-quarkus-extension-service/**'
      - '.github/workflows/debezium-quarkus-extension-service.yml'
      - '.env'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('debezium-quarkus-extension-service/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Check changes in [debezium-quarkus-extension-service] example
        run: cd debezium-quarkus-extension-service && mvn clean install -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn -Dmaven.wagon.http.pool=false -Dmaven.wagon.httpconnectionManager.ttlSeconds=120
