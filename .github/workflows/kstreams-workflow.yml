name: Build [kstreams]

on:
  push:
    paths:
      - 'kstreams/**'
      - '.github/workflows/kstreams-workflow.yml'
      - 'scripts/run-example-test.py'
  pull_request:
    paths:
      - 'kstreams/**'
      - '.github/workflows/kstreams-workflow.yml'
      - 'scripts/run-example-test.py'
      - '.env'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('kstreams/**/pom.xml', 'pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Check changes in [kstreams | poc-ddd-aggregates] example
        run: cd kstreams && mvn clean install -f poc-ddd-aggregates/pom.xml -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn -Dmaven.wagon.http.pool=false -Dmaven.wagon.httpconnectionManager.ttlSeconds=120
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install pyyaml requests
      - name: Run kstreams test
        run: python scripts/run-example-test.py kstreams
