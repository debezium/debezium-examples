name: Build [distributed-caching]

on:
  push:
    paths:
      - 'distributed-caching/**'
      - '.github/workflows/distributed-caching-workflow.yml'
      - 'scripts/run-example-test.py'
  pull_request:
    paths:
      - 'distributed-caching/**'
      - '.github/workflows/distributed-caching-workflow.yml'
      - 'scripts/run-example-test.py'
      - '.env'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install pyyaml requests
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('distributed-caching/**/pom.xml', 'pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Run E2E Test
        run: python scripts/run-example-test.py distributed-caching
