name: Build [milvus-to-pgvector]

on:
  push:
    paths:
      - 'milvus-to-pgvector/**'
      - '.github/workflows/milvus-to-pgvector-workflow.yml'
      - 'scripts/run-example-test.py'
  pull_request:
    paths:
      - 'milvus-to-pgvector/**'
      - '.github/workflows/milvus-to-pgvector-workflow.yml'
      - 'scripts/run-example-test.py'
      - '.env'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml requests

      - name: Run milvus-to-pgvector test
        run: python scripts/run-example-test.py milvus-to-pgvector
