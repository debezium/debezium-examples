name: Build [camel-kafka-connect]

on:
  push:
    paths:
      - 'camel-kafka-connect/**'
      - '.github/workflows/camel-kafka-connect.yml'
      - 'scripts/run-example-test.py'
  pull_request:
    paths:
      - 'camel-kafka-connect/**'
      - '.github/workflows/camel-kafka-connect.yml'
      - 'scripts/run-example-test.py'
      - '.env'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('camel-kafka-connect/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Check changes in [camel-kafka-connect] example
        run: cd camel-kafka-connect && mvn clean install -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn -Dmaven.wagon.http.pool=false -Dmaven.wagon.httpconnectionManager.ttlSeconds=120
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install pyyaml requests
      - name: Run camel-kafka-connect test
        run: python scripts/run-example-test.py camel-kafka-connect
