name: Build [debezium-neo4j]

on:
  push:
    paths:
      - 'debezium-neo4j/**'
      - '.github/workflows/debezium-neo4j-workflow.yml'
      - 'scripts/run-example-test.py'
      - '.env'
  pull_request:
    paths:
      - 'debezium-neo4j/**'
      - '.github/workflows/debezium-neo4j-workflow.yml'
      - 'scripts/run-example-test.py'
      - '.env'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml requests

      - name: Run debezium-neo4j test
        run: python scripts/run-example-test.py debezium-neo4j
