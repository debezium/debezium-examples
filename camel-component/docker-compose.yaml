services:
  mailhog:
    image: mailhog/mailhog
    ports:
      - 8025:8025

  qa-db:
    image: quay.io/debezium/example-postgres:${DEBEZIUM_VERSION:-latest}
    expose:
      - 5432
    healthcheck:
      test: "pg_isready -U postgres -d postgres"
      interval: 2s
      timeout: 20s
      retries: 10
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  qa-app:
    image: debezium-examples/qa-app:${DEBEZIUM_VERSION:-latest}
    build:
      context: qa-app
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - 8080:8080
    depends_on:
      qa-db:
        condition: service_healthy

  qa-camel:
    image: debezium-examples/qa-camel:${DEBEZIUM_VERSION:-latest}
    build:
      context: qa-camel
    depends_on:
      qa-db:
        condition: service_healthy
      mailhog:
        condition: service_started
      qa-app:
        condition: service_started
    environment:
      - JAVA_MAIN_CLASS=io.debezium.examples.camel.pipeline.Runner
      - JAVA_OPTIONS=-Ddatabase.hostname=qa-db -Ddatabase.port=5432 -Ddatabase.user=postgres -Ddatabase.password=postgres -Ddatabase.dbname=postgres -Ddatabase.schema=inventory -Dsmtp.hostname=mailhog -Dsmtp.port=1025 -Dtwitter.consumerKey=${TWITTER_CONSUMER_KEY:-dummy} -Dtwitter.consumerSecret=${TWITTER_CONSUMER_SECRET:-dummy} -Dtwitter.accessToken=${TWITTER_ACCESS_TOKEN:-dummy} -Dtwitter.accessTokenSecret=${TWITTER_ACCESS_TOKEN_SECRET:-dummy}
