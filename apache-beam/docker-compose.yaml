services:

  mysql:
    image: quay.io/debezium/example-mysql:${DEBEZIUM_VERSION}
    container_name: mysql-beam
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=debezium
      - MYSQL_USER=mysqluser
      - MYSQL_PASSWORD=mysqlpw

  bigquery:
    image: ghcr.io/goccy/bigquery-emulator:latest
    container_name: bigquery-beam
    ports:
      - "9050:9050"
      - "9060:9060"
    volumes:
      - ./data.yaml:/data.yaml
    command: --project=test-project --data-from-yaml=/data.yaml

  bigquery-ui:
    build: ./bigquery-ui
    pull_policy: build
    container_name: bigquery-ui-beam
    ports:
      - "8000:8000"
    environment:
      - BIGQUERY_ENDPOINT=http://bigquery:9050
    depends_on:
      - bigquery
