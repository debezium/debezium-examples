services:
  postgres:
    image: quay.io/debezium/example-postgres:${DEBEZIUM_VERSION}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U native -d native"]
      interval: 2s
      timeout: 20s
      retries: 10
    environment:
      - POSTGRES_USER=native
      - POSTGRES_PASSWORD=native
      - POSTGRES_DB=native
      - PGPASSWORD=native
    volumes:
      - ./src/main/resources/init.sql:/docker-entrypoint-initdb.d/z_init.sql

  product-service:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/native
      - QUARKUS_DATASOURCE_USERNAME=native
      - QUARKUS_DATASOURCE_PASSWORD=native
